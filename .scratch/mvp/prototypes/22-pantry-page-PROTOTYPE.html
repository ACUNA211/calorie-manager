<title>PROTOTYPE · Pantry page (#22)</title>
<!--
  THROWAWAY PROTOTYPE for .scratch/mvp/issues/22-pantry-page.md
  Question: what does the Pantry tab look like? How is it grouped (store section, exact vs. staple, or where it's kept)?
  How are leftovers shown and linked to the Meal Plan? How is an amount edited quickly, and a staple switched between
  have / low / out? Does it show which planned meals each food is set aside for, and what's missing for this week?
  Three layouts, switchable via ?variant=A|B|C, the floating bar, or the ← → keys:
    A: store sections (same order as the Grocery List). Leftovers on top, staples inline with a have/low/out switch,
       and a bar on each main food showing how much is set aside for planned meals.
    B: where it's kept (Fridge / Freezer / Cupboard / Spice rack). Tiles; a tap on a staple cycles have → low → out.
       Revised after the Member's reactions: a Current / With Grocery List switch on top (instead of this / next week),
       then the where-it's-kept tabs. No list on top: every food the next 7 days of meals need shows only as a tile where
       it's kept (red = short today or tomorrow, yellow = short later in the 7 days). With Grocery List adds every list
       item to the Pantry and subtracts the planned meals, so each tile shows what's left after them.
    C: plan first. "Covered this week?" by meal, then leftovers to use, then food that's free to use, then what's set
       aside, with staples folded into one checklist.
  Shared in all three: the amount editor (− / +, "used ¼ / ½ / all", type "2 lb" or "3 cups"), planning a leftover
  (it changes the Meal Plan and frees what the replaced meal had set aside), the Agent quick-add card with unit
  conversions (#04), adding by hand with no Agent call, delete with undo, and a This week / + next week's draft switch.
  Try the chat box: "a dozen eggs and 3 lb chicken breast", "2 cans chickpeas, cilantro", "olive oil".
  Scenario: Fri Oct 2, 4:10pm (same week as the #21 prototype). Saturday is left this week; next week's draft was made
  at 3:25pm and isn't approved yet. All state is in memory; reload or ↺ resets it.
-->

<script>
const fmt = n => Math.round(n).toLocaleString("en-US");
const params = new URLSearchParams(location.search);
let variant = params.get("variant") || "A";
const SEC = ["Produce","Meat & fish","Dairy & eggs","Bakery","Dry goods & staples","Frozen"];
const LOC = ["Fridge","Freezer","Cupboard","Spice rack"];
const LOCI = {Fridge:"🧊",Freezer:"❄️",Cupboard:"🚪","Spice rack":"🧂"};

// ---------- data ----------
// Main foods: m = measure (pc pieces, cup = grams shown with cups, ml = millilitres with cups, g = grams), per = grams per piece / per cup,
// q = amount (pieces for pc, grams for cup/g, mL for ml), res = [week, meal, amount] set aside for the Meal Plan.
// Staples: st = have | low | out. Leftovers: portions, kcal per portion, where it came from, and the meal it's planned for.

  const T=(id,n,sec,loc,st)=>({id,n,sec,loc,kind:"staple",st});
  return {

    P("egg","Eggs","Dairy & eggs","Fridge","pc",50,10,["egg","eggs"],[["this","Sat breakfast · Eggs & toast",2],["next","Sun breakfast · Pancakes",2],["next","Sun Prep Session · cookies",1],["next","Thu breakfast · Eggs & toast",2],["next","Sat breakfast · Eggs & toast",2]]),
    P("yog","Greek yogurt","Dairy & eggs","Fridge","cup",245,750,null,[["next","Mon–Wed + Fri breakfast · Yogurt & granola",680]]),

    P("apple","Apples","Produce","Cupboard","pc",182,0,["apple","apples"],[["this","Sat snack · Apple + peanut butter",1]]),
    P("bread","Whole wheat bread","Bakery","Cupboard","pc",32,8,["slice","slices"],[["this","Sat breakfast · Eggs & toast",2],["next","Thu breakfast · Eggs & toast",2],["next","Sat breakfast · Eggs & toast",2]]),
    P("tort","Flour tortillas","Bakery","Cupboard","pc",49,6,["tortilla","tortillas"],[["this","Sat dinner · Shrimp tacos",4],["next","Mon dinner · Turkey wraps",4]]),
    P("rice","White rice (dry)","Dry goods & staples","Cupboard","cup",185,1800,null,[["this","Sat lunch · Chicken rice bowl",75],["next","Sun lunch · Chicken rice bowl",75],["next","Sun Prep Session · Chickpea curry",150]]),
    P("oats","Rolled oats","Dry goods & staples","Cupboard","cup",80,600,null,[["next","Sun Prep Session · cookies",200]]),
    P("gran","Granola","Dry goods & staples","Cupboard","cup",120,400,null,[["next","Mon–Wed + Fri breakfast · Yogurt & granola",200]]),
    P("chickpea","Chickpeas, canned","Dry goods & staples","Cupboard","pc",425,2,["can","cans"],[["next","Sun Prep Session · Chickpea curry",2]]),
    P("alm","Almonds","Dry goods & staples","Cupboard","g",0,300,null),
    P("veg","Frozen mixed veg","Frozen","Freezer","g",0,750,null),
    T("oil","Olive oil","Dry goods & staples","Cupboard","low"),
    T("salt","Salt","Dry goods & staples","Spice rack","have"),
    T("pep","Black pepper","Dry goods & staples","Spice rack","have"),
    T("cumin","Cumin","Dry goods & staples","Spice rack","out"),
    T("chili","Chili powder","Dry goods & staples","Spice rack","have"),
    T("soy","Soy sauce","Dry goods & staples","Fridge","have"),
    T("pb","Peanut butter","Dry goods & staples","Cupboard","have"),
    T("flour","Flour","Dry goods & staples","Cupboard","have"),
    T("honey","Honey","Dry goods & staples","Cupboard","low"),
    T("garlic","Garlic","Produce","Cupboard","have"),
    T("butter","Butter","Dairy & eggs","Fridge","have"),
  ],
  left:[
    {id:"l1",n:"Beef stir-fry",portions:1,kpp:480,from:"Thursday's dinner",loc:"Fridge",plan:null},
    {id:"l2",n:"Chili",portions:1,kpp:650,from:"Sunday's Prep Session",loc:"Freezer",plan:null},
    {id:"l3",n:"Oatmeal cookies",portions:3,kpp:150,from:"Sunday's Prep Session",loc:"Cupboard",plan:null,unit:["cookie","cookies"]},
  ],
  missing:{this:[["Shrimp","Sat dinner · Shrimp tacos","list"],["Apples","Sat snack · Apple + peanut butter","out"]],
           next:[["Berries","Sun breakfast · Pancakes"],["Coconut milk","Sun Prep Session · Chickpea curry"],["Bell pepper","Tue dinner · Beef stir-fry"],["Rotisserie chicken","Wed dinner"],["Orzo","Thu dinner · Lemon chicken & orzo"],["Lemons","Thu dinner · Lemon chicken & orzo"]]},
  // B (revised): what the next 7 days of meals need, by food. [day, meal, amount]; day 0 = today (Fri), 1 = tomorrow (Sat).
  // Days 2-6 (Sun-Thu) are in next week's draft. Staples have no amount.
  need:{
    egg:[[1,"breakfast · Eggs & toast",2],[2,"breakfast · Pancakes",2],[2,"Prep Session · Oatmeal cookies",1],[6,"breakfast · Eggs & toast",2]],
    yog:[[3,"breakfast · Yogurt & granola",170],[4,"breakfast · Yogurt & granola",170],[5,"breakfast · Yogurt & granola",170]],
    gran:[[3,"breakfast · Yogurt & granola",40],[4,"breakfast · Yogurt & granola",40],[5,"breakfast · Yogurt & granola",40]],
    milk:[[2,"breakfast · Pancakes",240]],
    ched:[[1,"dinner · Shrimp tacos",40],[3,"dinner · Turkey wraps",40]],
    chick:[[1,"lunch · Chicken rice bowl",1],[2,"lunch · Chicken rice bowl",1],[2,"dinner · Sheet-pan chicken & veg",2]],
    turkey:[[3,"dinner · Turkey wraps",450]],
    broc:[[1,"lunch · Chicken rice bowl",90],[2,"lunch · Chicken rice bowl",90]],
    carrot:[[2,"dinner · Sheet-pan chicken & veg",5]],
    apple:[[1,"snack · Apple + peanut butter",1]],
    bread:[[1,"breakfast · Eggs & toast",2],[6,"breakfast · Eggs & toast",2]],
    tort:[[1,"dinner · Shrimp tacos",4],[3,"dinner · Turkey wraps",4]],
    rice:[[1,"lunch · Chicken rice bowl",75],[2,"lunch · Chicken rice bowl",75],[2,"Prep Session · Chickpea curry",150]],
    oats:[[2,"Prep Session · Oatmeal cookies",200]],
    chickpea:[[2,"Prep Session · Chickpea curry",2]],
    oil:[[2,"dinner · Sheet-pan chicken & veg"],[4,"dinner · Beef stir-fry"]],
    cumin:[[2,"Prep Session · Chickpea curry"]],
    pb:[[1,"snack · Apple + peanut butter"]],
    soy:[[4,"dinner · Beef stir-fry"]],
    shrimp:[[1,"dinner · Shrimp tacos",450]],
    berries:[[2,"breakfast · Pancakes",150]],
    coco:[[2,"Prep Session · Chickpea curry",1]],
    bell:[[4,"dinner · Beef stir-fry",2]],
    beef:[[4,"dinner · Beef stir-fry",400]],
    rotis:[[5,"dinner · Rotisserie chicken & salad",1]],
    orzo:[[6,"dinner · Lemon chicken & orzo",150]],
    lemon:[[6,"dinner · Lemon chicken & orzo",2]],
  },
  needOnly:[
    {id:"shrimp",n:"Shrimp",sec:"Meat & fish",loc:"Fridge",kind:"exact",m:"g",per:0,q:0},
    {id:"berries",n:"Berries",sec:"Produce",loc:"Fridge",kind:"exact",m:"g",per:0,q:0},
    {id:"coco",n:"Coconut milk",sec:"Dry goods & staples",loc:"Cupboard",kind:"exact",m:"pc",per:400,q:0,lbl:["can","cans"]},
    {id:"bell",n:"Bell peppers",sec:"Produce",loc:"Fridge",kind:"exact",m:"pc",per:120,q:0,lbl:["pepper","peppers"]},
    {id:"beef",n:"Beef strips",sec:"Meat & fish",loc:"Fridge",kind:"exact",m:"g",per:0,q:0},
    {id:"rotis",n:"Rotisserie chicken",sec:"Meat & fish",loc:"Fridge",kind:"exact",m:"pc",per:900,q:0,lbl:["chicken","chickens"]},
    {id:"orzo",n:"Orzo",sec:"Dry goods & staples",loc:"Cupboard",kind:"exact",m:"g",per:0,q:0},
    {id:"lemon",n:"Lemons",sec:"Produce",loc:"Fridge",kind:"exact",m:"pc",per:60,q:0,lbl:["lemon","lemons"]},
    {id:"water",n:"Sparkling water",sec:"Dry goods & staples",loc:"Cupboard",kind:"exact",m:"pc",per:355,q:0,lbl:["can","cans"]},
  ],
  // The Grocery List right now: shrimp from this week's approved plan, olive oil and honey (staples running low), and two
  // the Member added. Next week's shortfalls join it when the draft is approved. Staples on the list have no amount.
  glist:{shrimp:450, oil:1, honey:1, banana:6, water:12},
  planChanges:[], ai:0, cards:[], nid:100,
}; }
let S = fresh();
let undoStack = [];
let ui = {gl:false, wk:"this", filter:"all", loc:"Fridge", edit:null, editSnap:null, thinking:false, showRes:false, showStaples:false, typed:""};
const snap = () => undoStack.push(JSON.stringify(S));
function undo(){ if(!undoStack.length) return; S=JSON.parse(undoStack.pop()); closeSheet(true); render(); toast("Undone"); }
const item = id => S.items.find(i=>i.id===id);
const lo = id => S.left.find(l=>l.id===id);

// ---------- amounts ----------
function fq(q){ const w=Math.floor(q+1e-9), r=q-w; const f=Math.abs(r-.5)<.13?"½":Math.abs(r-.25)<.13?"¼":Math.abs(r-.75)<.13?"¾":""; if(r>.87) return String(w+1); if(f) return (w||"")+f; return String(w); }
function show(it, q=it.q){
  if(it.m==="pc") return `${fmt(q)} ${q===1?it.lbl[0]:it.lbl[1]} · about ${fmt(q*it.per)} g`;
  if(it.m==="cup") return `${fmt(q)} g · about ${fq(q/it.per)} cup${q/it.per>1.1?"s":""}`;
  if(it.m==="ml") return `${fmt(q)} mL · about ${fq(q/it.per)} cup${q/it.per>1.1?"s":""}`;
  return `${fmt(q)} g`;
}
function short(it, q){ return it.m==="pc" ? `${fmt(q)} ${q===1?it.lbl[0]:it.lbl[1]}` : `${fmt(q)} ${it.m==="ml"?"mL":"g"}`; }
const stepOf = it => it.m==="pc" ? 1 : it.m==="cup" ? Math.max(5, Math.round(it.per/20)*5) : it.m==="ml" ? 60 : (it.q>=300?50:25);
const resOf = it => (it.res||[]).filter(r=>r[0]==="this"||ui.wk==="both");
const reserved = it => resOf(it).reduce((a,r)=>a+r[2],0);
const free = it => it.q - reserved(it);
function resBar(it){
  if(!it.res||!it.res.length) return "";
  const r=reserved(it), tot=Math.max(it.q, r)||1, sh=Math.max(0,r-it.q);
  return `<div class="rbar"><i class="r" style="width:${Math.min(r,it.q)/tot*100}%"></i><i class="s" style="width:${sh/tot*100}%"></i></div>`;
}
function resLine(it){
  const rs=resOf(it); if(!rs.length) return "";
  const r=reserved(it), f=it.q-r;
  return `<div class="xs" style="color:#5b3fa0;margin-top:3px">${short(it,r)} set aside for ${rs.length} meal${rs.length>1?"s":""}${f<0?` · <b class="warn">short ${short(it,-f)}</b>`:` · ${short(it,f)} free`}</div>`;
}
function stapleTri(it){ return `<span class="tri">${["have","low","out"].map(s=>`<button class="${s} ${it.st===s?'on':''}" onclick="event.stopPropagation();setSt('${it.id}','${s}')">${s}</button>`).join("")}</span>`; }
function setSt(id,s){ snap(); const it=item(id); it.st=s; render(); refreshSheet();
  toast(s==="have"?`${it.n}: have`:`${it.n}: ${s}. The Agent suggests it on the Grocery List`, true); }
function cycleSt(id){ const it=item(id); setSt(id, {have:"low",low:"out",out:"have"}[it.st]); }

// ---------- what's missing ----------
function missingList(){
  const out = S.missing.this.map(m=>({n:m[0],meal:m[1],st:m[2],w:"this"}));
  if(ui.wk==="both") out.push(...S.missing.next.map(m=>({n:m[0],meal:m[1],st:"draft",w:"next"})));
  S.items.filter(it=>it.kind==="exact"&&it.q>0&&free(it)<0).forEach(it=>out.push({n:`${it.n}: short ${short(it,-free(it))}`,meal:resOf(it).map(r=>r[1].split(" · ")[0]).join(", "),st:resOf(it).some(r=>r[0]==="this")&&free({...it,res:it.res.filter(r=>r[0]==="this")})<0?"short":"draft",w:"short"}));
  return out;
}

function parseAmt(it, t){
  const m=t.trim().toLowerCase().match(/^(\d+(?:\.\d+)?)\s*(g|grams?|kg|lbs?|pounds?|oz|ounces?|cups?|ml|l|pieces?|pcs?)?$/); if(!m) return null;
  const n=+m[1], u=m[2]||"";
  if(/^kg/.test(u)) return {g:n*1000};
  if(/^(lb|pound)/.test(u)) return {g:n*453.6, note:`${n} lb is about ${fmt(n*453.6)} g`};
  if(/^(oz|ounce)/.test(u)) return {g:n*28.35, note:`${n} oz is about ${fmt(n*28.35)} g`};
  if(/^cup/.test(u)) return {g:n*(it.per||240), note:`${n} cups is about ${fmt(n*(it.per||240))} ${it.m==="ml"?"mL":"g"}`};
  if(/^(g|gram|ml)/.test(u)) return {g:n};

}

const ALIAS=[[/egg/,"egg"],[/chicken/,"chick"],[/yog/,"yog"],[/milk/,"milk"],[/cheddar|cheese/,"ched"],[/turkey/,"turkey"],[/broccoli/,"broc"],[/carrot/,"carrot"],[/banana/,"banana"],[/apple/,"apple"],[/bread/,"bread"],[/tortilla/,"tort"],[/rice/,"rice"],[/oat/,"oats"],[/granola/,"gran"],[/chickpea/,"chickpea"],[/almond/,"alm"],[/olive oil/,"oil"],[/cumin/,"cumin"],[/honey/,"honey"],[/peanut butter/,"pb"]];
function agentAdd(text){
  S.ai++;
  const parts=text.toLowerCase().split(/,|\band\b|&/).map(s=>s.trim()).filter(Boolean);
  const rows=parts.map(p=>{
    let m=p.match(/^(a dozen|dozen|\d+(?:\.\d+)?|a|an|one|two|three)\s*(lbs?|pounds?|oz|kg|g|grams?|cans?|cups?|bags?)?\s*(?:of\s+)?(.+)$/), n=null,u="",name=p;
    if(m){ n = /dozen/.test(m[1])?12 : isNaN(+m[1]) ? ({a:1,an:1,one:1,two:2,three:3}[m[1]]) : +m[1]; u=m[2]||""; name=m[3]; }
    const al=ALIAS.find(([r])=>r.test(name)), it=al&&item(al[1]);
    if(it && it.kind==="staple") return {id:it.id,kind:"staple",n:it.n,text:`set to have (was ${it.st})`};
    if(it){
      let add=null, note="", ask=false;
      if(/lb|pound/.test(u)){ const g=n*453.6; note=`${n} lb is about ${fmt(g)} g`; add = it.m==="pc" ? Math.round(g/it.per) : Math.round(g); ask = it.m==="pc"; }
      else if(/oz/.test(u)){ const g=n*28.35; note=`${n} oz is about ${fmt(g)} g`; add = it.m==="pc" ? Math.round(g/it.per) : Math.round(g); ask = it.m==="pc"; }
      else if(/^(g|gram|kg)/.test(u)) add = it.m==="pc" ? Math.round(n*(u==="kg"?1000:1)/it.per) : n*(u==="kg"?1000:1);
      else if(/cup/.test(u)) add = Math.round(n*(it.per||240));
      else if(n!=null) add = it.m==="pc" ? n : Math.round(n*(it.per||100));
      else add = stepOf(it);
      return {id:it.id,kind:"add",n:it.n,add,note,ask};
    }
    const [sec,loc]=guessSec(name);
    return {kind:"new",n:name.charAt(0).toUpperCase()+name.slice(1),sec,loc,q:n?Math.round(n*(/can/.test(u)?425:/lb/.test(u)?453.6:1)):0,staple:!n};
  });
  return rows;
}

// ================= B: where it's kept (revised after the Member's reactions) =================
// Current / With Grocery List replaces This week / + next week. No list on top: each food the next 7 days of meals need
// shows only as a tile where it's kept. Red = short today or tomorrow, yellow = short later in the 7 days (today through Thu).
// With Grocery List adds every list item and subtracts the planned meals, so a tile shows what's left after them.
const DAYS = ["Today","Tomorrow","Sun","Mon","Tue","Wed","Thu"];
const food = id => item(id) || S.needOnly.find(f=>f.id===id);
const onList = id => S.glist[id]!=null;
function needStat(id){
  const it=food(id), ns=[...(S.need[id]||[])].sort((a,b)=>a[0]-b[0]), stp=it.kind==="staple";
  const listed = ui.gl && onList(id);
  const av = stp ? (it.st!=="out"||listed ? 1e9 : 0) : (it.q||0) + (listed ? S.glist[id] : 0);
  const total = stp ? 0 : ns.reduce((a,n)=>a+n[2],0);
  let cum=0, day=null;
  for(const n of ns){ cum += stp ? 1 : n[2]; if(cum>av){ day=n[0]; break; } }
  return {id, it, ns, av, total, day, lvl: day==null ? "ok" : day<=1 ? "red" : "yel", by: stp ? 0 : Math.max(0,total-av), listed};
}
function listAdd(id){
  snap(); const was=ui.gl; ui.gl=false; const st=needStat(id); ui.gl=was;
  S.glist[id] = st.it.kind==="staple" ? 1 : st.by;
  render(); toast(`${st.it.n} added to the Grocery List`, true);
}
function VariantB(){
  // every food in the Pantry, plus foods that are only needed or only on the list
  const foods = [...S.items, ...S.needOnly.filter(f=>(S.need[f.id]||[]).length || onList(f.id))];
  const stats = Object.fromEntries(foods.map(f=>[f.id, needStat(f.id)]));
  const lvlAt = l => { const xs=foods.filter(f=>f.loc===l&&stats[f.id].lvl!=="ok"); return xs.length?[xs.length, xs.some(f=>stats[f.id].lvl==="red")?"var(--warn)":"#b08a00"]:null; };
  const glN = Object.keys(S.glist).length;
  const seg = `<div class="seg" style="margin-top:8px"><button class="${!ui.gl?'on':''}" onclick="ui.gl=false;render()">Current</button><button class="${ui.gl?'on':''}" onclick="ui.gl=true;render()">With Grocery List <span class="xs mute">(${glN})</span></button></div>
    <div class="xs mute" style="margin:4px 16px 0;text-align:center">${ui.gl?`The Pantry plus the ${glN} item${glN===1?"":"s"} on the list, minus the meals planned through Thu`:"What's in the kitchen right now"}</div>`;
  const tabs = `<div class="seg" style="margin-top:10px">${LOC.map(l=>{ const c=lvlAt(l); return `<button class="${ui.loc===l?'on':''}" onclick="ui.loc='${l}';render()">${LOCI[l]} ${l}${c?` <b style="color:${c[1]}">·${c[0]}</b>`:""}</button>`; }).join("")}</div>`;
  const lefts = S.left.filter(l=>l.loc===ui.loc);
  const its = foods.filter(f=>f.loc===ui.loc);
  const meals = x => x.ns.map(n=>`${DAYS[n[0]]} ${n[1].split(" · ")[0]}${x.it.kind==="staple"?"":` (${short(x.it,n[2])})`}`).join(", ");
  const fix = x => x.lvl==="ok" ? "" : onList(x.id) ? (ui.gl?"":`<span class="chip list">on list</span>`)
    : x.day>=2 ? `<span class="chip draft">list when draft approved</span>`
    : `<button class="btn ghost xs" style="padding:0" onclick="event.stopPropagation();listAdd('${x.id}')">+ Add to list</button>`;
  const needLine = x => !x.ns.length ? "" : x.lvl==="ok"
    ? `<div class="xs" style="color:#5b3fa0;margin-top:3px">📅 ${x.it.kind==="staple"?"needed "+DAYS[x.ns[0][0]]:`${short(x.it,x.total)} for ${x.ns.length} meal${x.ns.length>1?"s":""}`}</div>`
    : `<div class="xs" style="margin-top:3px;font-weight:600;color:${x.lvl==="red"?"var(--warn)":"#8a6d00"}">${x.it.kind==="staple"?"out from":ui.gl?"runs out":`short ${short(x.it,x.by)} from`} ${DAYS[x.day]}: ${(x.ns.find(n=>n[0]===x.day)[1].split(" · ")[1])||""}</div>`;
  const tile = it => { const x=stats[it.id], stp=it.kind==="staple", lv=x.lvl!=="ok"?x.lvl:"", isNew=!item(it.id);
    const open = isNew ? "" : stp ? `cycleSt('${it.id}')` : `openEdit('${it.id}')`;
    const listed = ui.gl && onList(it.id);
    let amt, sub;
    if(stp){
      amt = `<span style="font-weight:700;color:${it.st==="have"?"var(--good)":it.st==="low"?"var(--low)":"var(--warn)"}">${it.st.toUpperCase()}</span>${listed?` <span class="chip list">+ on list</span>`:""}`;
      sub = ui.gl ? "" : `<div class="xs mute">tap: have → low → out</div>`;
    } else if(ui.gl){
      const left = x.av - x.total;
      amt = left<0 ? `<b class="warn">short ${short(it,-left)}</b>` : left===0 ? `<b>none left over</b>` : `<b>${short(it,left)}</b> <span class="xs mute">left over</span>`;
      const parts = [it.q ? `${short(it,it.q)} have` : "none in the Pantry"]; if(listed) parts.push(`<span style="color:var(--accent)">+ ${short(it,S.glist[it.id])} list</span>`); if(x.total) parts.push(`− ${short(it,x.total)} planned`);
      sub = `<div class="xs mute">${parts.join(" ")}</div>`;
    } else {
      amt = (it.q||0)===0 ? (isNew?`<span class="mute">not in the Pantry</span>`:"none left") : show(it).split(" · ")[0];
      sub = `<div class="xs mute">${it.q?show(it).split(" · ")[1]||"":onList(it.id)?`<span style="color:var(--accent)">${short(it,S.glist[it.id])} on the list</span>`:""}</div>`;
    }
    return `<div class="tile ${lv} ${isNew&&listed?"gl":""}" ${open?`onclick="${open}"`:""} title="${x.ns.length?meals(x):""}"><div class="nm">${it.n}</div><div class="small">${amt}</div>${sub}${ui.gl&&!stp&&x.lvl==="ok"?"":needLine(x)}<div style="margin-top:3px">${fix(x)}</div>${stp&&!isNew?`<button class="btn ghost xs" style="position:absolute;top:4px;right:6px" onclick="event.stopPropagation();openEdit('${it.id}')">⋯</button>`:""}</div>`; };
  const ltile = l => `<div class="tile lo" onclick="openPlan('${l.id}')"><div class="nm">↺ ${l.n}</div><div class="small"><span class="dots">${"●".repeat(l.portions)}</span> ${l.portions} × ${l.kpp}</div><div class="xs ${l.plan?"good":"warn"}">${l.plan?"📅 "+l.plan.split(" · ")[0]:"Not planned · tap to plan"}</div><div class="xs mute">from ${l.from}</div></div>`;
  const rank = it => ({red:0,yel:1,ok:2})[stats[it.id].lvl];
  const sortIt = [...its].sort((a,b)=>rank(a)-rank(b) || (stats[a.id].day??9)-(stats[b.id].day??9) || (a.kind==="staple")-(b.kind==="staple") || SEC.indexOf(a.sec)-SEC.indexOf(b.sec));
  return head("Pantry") + seg + tabs + chatParts()
    + `<div class="tiles">${lefts.map(ltile).join("")}${sortIt.map(tile).join("")}</div>`
    + (its.length||lefts.length?"":`<div class="card small mute">Nothing kept here.</div>`)
    + `<div class="xs mute" style="margin:0 16px">Red = short for a meal today or tomorrow. Yellow = short for a meal later in the next 7 days (Sun–Thu are next week's draft). Green frame = leftover.${ui.gl?" Dashed = only on the Grocery List.":""}</div>` + stateBox() + entryBar();
}

// ================= C: plan first =================
function VariantC(){
  const miss = missingList();
  const meals = ui.wk==="both"
    ? [["Sat","Eggs & toast",["egg","bread"]],["Sat","Chicken rice bowl",["chick","rice","broc"]],["Sat","Shrimp tacos",["tort","ched"],"Shrimp"],["Sat","Apple + peanut butter",["apple"]],["Next Sun","Pancakes & berries",["egg","milk"],"Berries"],["Next Sun","Prep Session",["chickpea","rice","oats","egg"],"Coconut milk"],["Next Sun","Sheet-pan chicken & veg",["chick","carrot"]],["Next Mon","Turkey wraps",["turkey","tort","ched"]],["Next Tue","Beef stir-fry",[],"Bell pepper"],["Next Wed","Rotisserie chicken & salad",[],"Rotisserie chicken"],["Next Thu","Lemon chicken & orzo",[],"Orzo, lemons"]]
    : [["Sat","Eggs & toast",["egg","bread"]],["Sat","Chicken rice bowl",["chick","rice","broc"]],["Sat","Shrimp tacos",["tort","ched"],"Shrimp"],["Sat","Apple + peanut butter",["apple"]]];
  const satLeft = S.left.find(l=>l.plan&&l.plan.startsWith("Sat lunch")), satDin = S.left.find(l=>l.plan&&l.plan.startsWith("Sat dinner"));
  const rowsM = meals.map(([d,n,ids,miss2])=>{
    if(d==="Sat"&&n==="Chicken rice bowl"&&satLeft) return [d,`${satLeft.n} (leftover)`,[],null,true];
    if(d==="Sat"&&n==="Shrimp tacos"&&satDin) return [d,`${satDin.n} (leftover)`,[],null,true];
    return [d,n,ids,miss2,false];
  }).map(([d,n,ids,miss2,isLeft])=>{
    const shortIds = ids.filter(id=>{ const it=item(id); return it && (it.q===0 || free(it)<0); });
    const ok = !miss2 && !shortIds.length;
    const onList = miss2 && (miss2!=="Shrimp" || S.missing.this.some(m=>m[0]==="Shrimp"&&m[2]==="list"));
    return `<div class="need"><span style="font-size:16px">${ok?"✅":shortIds.length&&!miss2?"⚠️":"🛒"}</span><div class="sp"><div><b>${n}</b> <span class="xs mute">${d}${d.startsWith("Next")?" · draft":""}</span></div>
      <div class="xs">${isLeft?`<span class="good">From the leftovers</span>`:ok?`<span class="mute">All in the Pantry: ${ids.map(id=>item(id)&&item(id).n.toLowerCase()).filter(Boolean).join(", ")}</span>`:""}
      ${miss2?`<span class="${d.startsWith("Next")?"":"warn"}">Needs ${miss2.toLowerCase()}</span> ${d.startsWith("Next")?`<span class="chip draft">list on approval</span>`:onList?`<span class="chip list">on list</span>`:""}`:""}
      ${shortIds.map(id=>{ const it=item(id); return it.q===0?`<span class="warn">Out of ${it.n.toLowerCase()}</span> <button class="btn ghost xs" onclick="addToList('${it.n}')">+ Add to list</button>`:`<span class="warn">${it.n}: short ${short(it,-free(it))}</span>`; }).join(" ")}</div></div></div>`;
  }).join("");
  const freeItems = S.items.filter(it=>it.kind==="exact"&&it.q>0&&free(it)>0).sort((a,b)=>SEC.indexOf(a.sec)-SEC.indexOf(b.sec));
  const resItems = S.items.filter(it=>it.kind==="exact"&&resOf(it).length);
  const st = S.items.filter(i=>i.kind==="staple"), bad = st.filter(i=>i.st!=="have");
  return head("Pantry") + weekSeg()
    + `<div class="card" style="padding:10px 14px"><div class="row"><b class="sp">Covered ${ui.wk==="both"?"through next week":"for the rest of this week"}?</b><span class="xs mute">${miss.length} to buy</span></div>${rowsM}</div>`
    + chatParts()
    + (S.left.length?`<div class="sec"><h3>Leftovers to use</h3></div>${S.left.map(l=>leftCard(l)).join("")}`:"")
    + `<div class="sec"><h3>Free to use</h3><span class="sp"></span><span class="xs mute">not set aside for any meal</span></div>
       <div class="list">${freeItems.map(it=>`<div class="li row"><div class="sp" onclick="openEdit('${it.id}')" style="cursor:pointer"><div class="nm">${it.n}</div><div class="xs mute">${short(it,free(it))} free${reserved(it)?` of ${short(it,it.q)}`:""}</div></div>
          <span class="step"><button onclick="quick('${it.id}',-1)">−</button><span style="min-width:64px">${short(it,stepOf(it))}</span><button onclick="quick('${it.id}',1)">+</button></span></div>`).join("")}</div>
       <div class="sec"><h3>Set aside</h3><span class="sp"></span><button class="btn ghost xs" onclick="ui.showRes=!ui.showRes;render()">${ui.showRes?"Hide":"Show"} ${resItems.length} foods</button></div>
       ${ui.showRes?`<div class="list">${resItems.map(it=>`<div class="li" onclick="openEdit('${it.id}')" style="cursor:pointer"><div class="row"><span class="nm sp">${it.n}</span><span class="small">${short(it,reserved(it))} of ${short(it,it.q)}</span></div><div class="xs mute">${resOf(it).map(r=>r[1].split(" · ")[0]).join(" · ")}</div>${resBar(it)}</div>`).join("")}</div>`:""}
       <div class="sec"><h3>Staples</h3><span class="sp"></span><span class="xs ${bad.length?"warn":"good"}">${bad.length?`${bad.length} low or out`:"all good"}</span></div>
       <div class="list">${bad.map(it=>`<div class="li row"><span class="sp">${it.n}</span>${stapleTri(it)}</div>`).join("")}
         <div class="li"><button class="btn ghost small" onclick="ui.showStaples=!ui.showStaples;render()">${ui.showStaples?"Hide":"Show"} the ${st.length-bad.length} you have</button></div>
         ${ui.showStaples?st.filter(i=>i.st==="have").map(it=>`<div class="li row"><span class="sp">${it.n}</span>${stapleTri(it)}</div>`).join(""):""}</div>`
    + stateBox() + entryBar();
}
function quick(id,d){ snap(); const it=item(id); it.q=Math.max(0,it.q+d*stepOf(it)); render(); toast(`${it.n}: ${show(it)}`, true); }

// ---------- shell + switcher ----------
let sheetFn=null;
function showSheet(fn){ sheetFn=fn; refreshSheet(); }
function refreshSheet(){ if(!sheetFn) return; document.getElementById("sheet").innerHTML=`<div class="shade" onclick="closeSheet()"></div><div class="sheet">${sheetFn()}</div>`; }
function closeSheet(silent){ if(sheetFn===editSheet&&!silent){ eDone(); return; } sheetFn=null; document.getElementById("sheet").innerHTML=""; }
function toast(msg, withUndo){
  const box=document.getElementById("toastbox");
  box.innerHTML = `<div class="toast"><span>${msg}</span>${withUndo?`<button onclick="undo()">Undo</button>`:""}</div>`;
  clearTimeout(toast.t); toast.t=setTimeout(()=>box.innerHTML="", withUndo?6000:2500);
}
const VARIANTS = {A:["Store sections",VariantA], B:["Where it's kept",VariantB], C:["Plan first",VariantC]};
const KEYS = Object.keys(VARIANTS);
function cycle(dir){ variant = KEYS[(KEYS.indexOf(variant)+dir+KEYS.length)%KEYS.length]; history.replaceState(null,"","?variant="+variant); closeSheet(true); render(); scrollTo(0,0); }
function render(){
  if(!VARIANTS[variant]) variant="A";
  document.getElementById("app").innerHTML = VARIANTS[variant][1]() + `
    <div class="tabs">${[["Today","◉"],["Plan","▦"],["Pantry","▣"],["Grocery","☐"],["Chat","✉"]].map(([n,i])=>`<button class="${n==='Pantry'?'cur':''}" onclick="${n==='Pantry'?'':`toast('Not in this prototype')`}"><span class="i">${i}</span>${n}</button>`).join("")}</div>`;
  document.getElementById("sw").innerHTML = `<button onclick="cycle(-1)">←</button><b>${variant} · ${VARIANTS[variant][0]}</b><button onclick="cycle(1)">→</button>
    <button onclick="S=fresh();undoStack=[];closeSheet(true);render()" title="Reset state">↺</button>`;
}
addEventListener("keydown", e => { if(e.target.closest("input,textarea,[contenteditable]")) return; if(e.key==="ArrowLeft") cycle(-1); if(e.key==="ArrowRight") cycle(1); if(e.key==="Escape") closeSheet(); });
render();
</script>
