<title>PROTOTYPE · Plan page (#21)</title>
<!--
  THROWAWAY PROTOTYPE for .scratch/mvp/issues/21-plan-page.md
  Question: what does the Plan tab look like? Grid, list of days, or one day at a time? How does Friday's draft look
  before approval and where is Approve? How is "what changed" shown after approval? How are meals swapped (3 alternatives),
  edited, moved or cleared on the page? How does next week sit alongside this week?
  Three layouts, switchable via ?variant=A|B|C, the floating bar, or the ← → keys:
    A: week grid (days as rows, slots as columns), This week / Next week toggle, tap a cell for a sheet.
    B: list of days, one long scroll: this week, then next week's draft below a divider, with actions inline on each meal.
    C: one day at a time, a 14-day strip across both weeks, big meal cards, and a review screen for the draft.
  The swap / edit / move / clear sheets and the data are shared; only the layout differs.
  Scenario: 2,000 Calorie Target, planned to 95%. It's Fri Oct 2, 3:40pm, after the weekly reflection (#15).
  This week (Sep 28 – Oct 4) was approved last Friday and has 4 changes since. Next week (Oct 5 – 11) is the Agent's draft,
  built with the 4 recommendations accepted in the Recap. All state is in memory; reload or ↺ resets it.
-->

  #sw{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:6px 8px;display:flex;gap:6px;align-items:center;box-shadow:0 6px 20px #0005;z-index:99;font-size:13px;white-space:nowrap}

<script>
// ---------- constants ----------
const TARGET = 2000;
const SHARE = [475, 570, 665, 190];              // 25/30/35/10 of 2,000, planned to 95%
const SLOT = ["Breakfast","Lunch","Dinner","Snack"];
const SL = ["B","L","D","S"];
const TIME = ["8:00","12:00","18:00","any time"];
const fmt = n => Math.round(n).toLocaleString("en-US");
const params = new URLSearchParams(location.search);
let variant = params.get("variant") || "A";

// ---------- data ----------
// m: d dish, k kcal, t minutes, ty cook|left|out|open|prep, from (leftover source), nw new, fav, needs [[item,status]] status need|list|bought,
//    eaten (logged kcal), label/aim for Eating Out, ch {from, by, when, why}
const M = (d,k,t,x={}) => ({d,k,t,ty:"cook",...x});
const Y = () => M("Yogurt & granola",470,5,{fav:true});
const AP = () => M("Apple + peanut butter",190,3,{fav:true});
function fresh(){
  const thisWeek = {
    key:"this", label:"This week", range:"Sep 28 – Oct 4", approved:true, approvedAt:"Fri Sep 25, 5:40pm",
    days:[
      {n:"Mon", date:"Sep 28", past:true, m:[{...Y(),eaten:470}, M("Chili",570,5,{ty:"left",from:"Sunday's Prep Session",eaten:770}), M("Burrito bowl",660,30,{eaten:660}), {...AP(),eaten:190}]},
      {n:"Tue", date:"Sep 29", past:true, m:[{...Y(),eaten:470}, M("Work lunch",650,0,{ty:"out",label:"Tuesday work lunch",aim:650,eaten:650}), M("Turkey wraps",430,20,{eaten:430,fav:true,ch:{from:"Salmon & rice",by:"You",when:"Mon 9:12pm",why:"asked in chat; Pantry first"}}), {...AP(),eaten:190}]},
      {n:"Wed", date:"Sep 30", past:true, busy:true, m:[{...Y(),eaten:470}, M("Chili & cornbread",570,5,{ty:"left",from:"Sunday's Prep Session",eaten:870}), M("Turkey wraps",420,15,{eaten:420,ch:{from:"Burrito bowl",by:"Rebalance",when:"Wed 2:10pm",why:"lunch went 300 over"}}), {...AP(),eaten:190}]},
      {n:"Thu", date:"Oct 1", past:true, m:[{...Y(),eaten:470}, M("Chicken rice bowl",560,15,{eaten:560}), M("Beef stir-fry",640,30,{eaten:640}), M("Greek yogurt",150,1,{eaten:150,ch:{from:"Apple + peanut butter",by:"You",when:"Thu 3:05pm",why:"out of apples"}})]},
      {n:"Fri", date:"Oct 2", today:true, m:[{...Y(),eaten:470}, M("Beef stir-fry",480,5,{ty:"left",from:"Thursday's dinner",eaten:480}), M("Pizza night",800,0,{ty:"out",label:"Pizza night",aim:800}), AP()]},
      {n:"Sat", date:"Oct 3", m:[M("Eggs & toast",460,10), M("Chili",570,5,{ty:"left",from:"Sunday's Prep Session"}), M("Shrimp tacos",650,35,{nw:true,needs:[["shrimp","list"],["tortillas","bought"]],ch:{from:"Salmon & rice",by:"You",when:"Thu 8:30pm",why:"asked in chat; salmon removed from the Grocery List"}}), AP()]},
      {n:"Sun", date:"Oct 4", prep:{text:"Prep Session, 2 pm, 1 h 50 min: chickpea curry (Mon + Wed lunch) and oatmeal cookies (weekday snacks)", draft:true}, m:[M("Pancakes & berries",480,20,{needs:[["berries","bought"]]}), M("Chicken rice bowl",560,15), M("Sheet-pan chicken & veg",640,45,{fav:true}), AP()]},
    ],
    changes:[]
  };
  thisWeek.changes = [
    {di:5,si:2,from:"Salmon & rice",to:"Shrimp tacos",by:"You",when:"Thu 8:30pm",why:"Asked in chat. Grocery List: − salmon, + shrimp"},
    {di:3,si:3,from:"Apple + peanut butter",to:"Greek yogurt",by:"You",when:"Thu 3:05pm",why:"Out of apples. From the Pantry"},
    {di:2,si:2,from:"Burrito bowl",to:"Turkey wraps",by:"Rebalance",when:"Wed 2:10pm",why:"Lunch went 300 over. Proposed by the Agent, you said yes"},
    {di:1,si:2,from:"Salmon & rice",to:"Turkey wraps",by:"You",when:"Mon 9:12pm",why:"Asked in chat. From the Pantry"},
  ];
  const C = () => M("Oatmeal cookie",150,0,{ty:"prep",from:"Sunday's Prep Session"});
  const nextWeek = {
    key:"next", label:"Next week", range:"Oct 5 – 11", approved:false, draftAt:"Fri Oct 2, 3:25pm",
    intro:[
      "A 150-kcal sweet snack on weekdays: oatmeal cookies from Sunday's Prep Session",
      "No salmon (saved as a soft Dislike)",
      "One new chickpea Dish: chickpea curry, cooked Sunday, for Mon and Wed lunch",
      "Pizza night aim raised to 1,000, with a lighter Friday lunch (lentil soup, 410)",
    ],
    days:[
      {n:"Mon", date:"Oct 5", m:[Y(), M("Chickpea curry & rice",540,5,{ty:"prep",nw:true,from:"Sunday's Prep Session",needs:[["chickpeas","bought"]]}), M("Turkey wraps",620,20,{fav:true}), C()]},
      {n:"Tue", date:"Oct 6", m:[Y(), M("Work lunch",650,0,{ty:"out",label:"Tuesday work lunch",aim:650}), M("Beef stir-fry",640,30,{fav:true,needs:[["bell pepper","need"]]}), C()]},
      {n:"Wed", date:"Oct 7", busy:true, m:[Y(), M("Chickpea curry & rice",540,5,{ty:"prep",from:"Sunday's Prep Session"}), M("Rotisserie chicken & salad",600,10,{needs:[["rotisserie chicken","need"]]}), C()]},
      {n:"Thu", date:"Oct 8", m:[M("Eggs & toast",460,10), M("Beef stir-fry",560,5,{ty:"left",from:"Tuesday's dinner"}), M("Lemon chicken & orzo",650,55,{nw:true,needs:[["orzo","need"],["lemons","need"]]}), C()]},
      {n:"Fri", date:"Oct 9", m:[Y(), M("Lentil soup",410,10), M("Pizza night",1000,0,{ty:"out",label:"Pizza night",aim:1000}), M("Open",100,0,{ty:"open"})]},
      {n:"Sat", date:"Oct 10", m:[M("Pancakes & berries",480,20,{needs:[["berries","need"]]}), M("Lemon chicken & orzo",560,5,{ty:"left",from:"Thursday's dinner"}), M("Chili",650,90,{fav:true}), AP()]},
      {n:"Sun", date:"Oct 11", m:[M("Eggs & toast",460,10), M("Chili",570,5,{ty:"left",from:"Saturday's dinner"}), M("Sheet-pan chicken & veg",640,45,{fav:true}), AP()]},
    ],
    changes:[]
  };
  return {weeks:{this:thisWeek, next:nextWeek}};
}
let S = fresh();
let undoStack = [];
let ui = {wk: params.get("week") || "this", day: {w:"this", i:4}, open:{}, sheet:null, review:true, showChanges:false};

// Swap pool per slot. Pantry fit first after approval (#06).
const POOL = [
  [M("Yogurt & granola",470,5,{fav:true}), M("Eggs & toast",460,10), M("Overnight oats",450,5,{nw:true,needs:[["chia seeds","need"]]}), M("Pancakes & berries",480,20,{needs:[["berries","need"]]}), M("Breakfast burrito",490,15)],
  [M("Chicken rice bowl",560,15), M("Turkey wraps",540,10,{fav:true}), M("Lentil soup",410,10), M("Tuna salad sandwich",520,10,{needs:[["tuna","need"]]}), M("Chickpea salad",500,10,{nw:true})],
  [M("Turkey wraps",620,20,{fav:true}), M("Beef stir-fry",640,30,{fav:true,needs:[["bell pepper","need"]]}), M("Sheet-pan chicken & veg",640,45,{fav:true}), M("Chickpea curry & rice",600,40,{nw:true}), M("Pork chops & potatoes",660,40,{nw:true,needs:[["pork chops","need"]]}), M("Chili",650,90,{fav:true})],
  [M("Apple + peanut butter",190,3,{fav:true}), M("Greek yogurt",150,1), M("Hummus & carrots",170,3), M("Dark chocolate square",150,0,{needs:[["dark chocolate","list"]]})],
];
const WHY = {
  "Yogurt & granola":"Favorite · all in Pantry", "Eggs & toast":"All in Pantry", "Overnight oats":"New · needs chia seeds", "Pancakes & berries":"Needs berries", "Breakfast burrito":"All in Pantry",
  "Chicken rice bowl":"All in Pantry", "Turkey wraps":"Favorite · all in Pantry", "Lentil soup":"All in Pantry · light", "Tuna salad sandwich":"Needs tuna", "Chickpea salad":"New · chickpeas in Pantry",
  "Beef stir-fry":"Favorite · needs bell pepper", "Sheet-pan chicken & veg":"Favorite · all in Pantry", "Chickpea curry & rice":"New · all in Pantry", "Pork chops & potatoes":"New · needs pork chops", "Chili":"Favorite · all in Pantry, 90 min",
  "Apple + peanut butter":"Favorite · all in Pantry", "Greek yogurt":"All in Pantry", "Hummus & carrots":"All in Pantry", "Dark chocolate square":"On your Grocery List",
};

// ---------- helpers ----------
const W = k => S.weeks[k];
const kcal = m => m.ty==="out" ? m.aim : m.k;
const dayTotal = d => d.m.reduce((a,m)=>a+kcal(m),0);
const isWeekend = d => d.n==="Sat" || d.n==="Sun";
function limit(d,si){ if(d.busy) return 15; return [10,15,isWeekend(d)?90:45,5][si]; }
function overTime(d,si,m){ return (m.ty==="cook") && m.t > limit(d,si); }
function locked(w,di,si){ const d=W(w).days[di]; return d.past || m_eaten(d.m[si]); }
const m_eaten = m => m.eaten!=null;
function title(m){ return m.ty==="out" ? "⌂ "+m.label : m.ty==="open" ? "Open" : m.d; }
function needsHtml(m, w){
  if(!m.needs || !m.needs.length) return "";
  return m.needs.map(([it,st]) => st==="bought" ? `<span class="chip bought">${it} · bought ✓</span>`
    : st==="list" ? `<span class="chip need">Needs: ${it} · on Grocery List</span>`
    : `<span class="chip need">Needs: ${it}${W(w).approved?" · on Grocery List":" · goes on the list when approved"}</span>`).join("");
}
function chips(w,di,si,opt={}){
  const d=W(w).days[di], m=d.m[si], c=[];
  if(m.ty==="out") c.push(`<span class="chip out">Eating Out · aim ${fmt(m.aim)}</span>`);
  if(m.ty==="open") c.push(`<span class="chip">${fmt(m.k)} set aside, nothing planned</span>`);
  if(m.ty==="left") c.push(`<span class="chip left">↺ from ${m.from}</span>`);
  if(m.ty==="prep") c.push(`<span class="chip prep">🍳 from ${m.from}</span>`);
  if(m.nw) c.push(`<span class="chip new">★ New</span>`);
  if(m.fav && !opt.short) c.push(`<span class="chip fav">♥ Favorite</span>`);
  if(overTime(d,si,m)) c.push(`<span class="chip time">⏱ ${m.t} min · limit ${limit(d,si)}</span>`);
  else if(m.t && m.ty==="cook" && !opt.short) c.push(`<span class="chip">${m.t} min</span>`);
  c.push(needsHtml(m,w));
  if(m.ch && W(w).approved) c.push(`<span class="chip chg">Changed · was ${m.ch.from}</span>`);
  return c.join("");
}
function missingCount(w){
  const set=new Set();
  W(w).days.forEach(d=>{ if(d.past) return; d.m.forEach(m=>(m.needs||[]).forEach(([it,st])=>{ if(st!=="bought") set.add(it); })); });
  return set.size;
}
function missingList(w){
  const set=new Set();
  W(w).days.forEach(d=>{ if(d.past) return; d.m.forEach(m=>(m.needs||[]).forEach(([it,st])=>{ if(st!=="bought") set.add(it); })); });
  return [...set];
}
function totalLine(d){
  const t=dayTotal(d), over=t>TARGET;
  return `<span class="${over?'warn':''}" style="font-weight:600">${fmt(t)}</span><span class="mute"> / ${fmt(TARGET)}</span>`;
}
function totalBar(d){ const t=dayTotal(d); return `<div class="bar"><i class="${t>TARGET?'over':''}" style="width:${Math.min(100,t/TARGET*100)}%"></i></div>`; }

// ---------- state changes (all undoable) ----------
function snapshot(){ undoStack.push(JSON.stringify(S)); if(undoStack.length>30) undoStack.shift(); }
function undo(){ if(!undoStack.length) return; S=JSON.parse(undoStack.pop()); closeSheet(); toast("Undone"); render(); }
function record(w,di,si,from,to,why){
  const wk=W(w); if(!wk.approved) return;
  const m=wk.days[di].m[si];
  m.ch = {from: m.ch ? m.ch.from : from, by:"You", when:"just now", why};
  wk.changes.unshift({di,si,from,to,by:"You",when:"just now",why});
}
function groceryNote(w, oldM, newM){
  if(!W(w).approved) return "";
  const add=(newM.needs||[]).filter(([_,s])=>s!=="bought").map(([i])=>i);
  newM.needs=(newM.needs||[]).map(([i,s])=>[i,s==="need"?"list":s]);
  const drop=(oldM.needs||[]).filter(([_,s])=>s==="list").map(([i])=>i);
  const bits=[]; if(add.length) bits.push("+ "+add.join(", ")); if(drop.length) bits.push("− "+drop.join(", ")+" (unticked)");
  return bits.length ? ` Grocery List: ${bits.join(" · ")}.` : "";
}
function doSwap(w,di,si,pi){
  snapshot();
  const d=W(w).days[di], old=d.m[si], nm=JSON.parse(JSON.stringify(POOL[si][pi]));
  const g=groceryNote(w,old,nm);
  d.m[si]=nm; record(w,di,si,title(old),nm.d,"Swapped on the page."+g);
  closeSheet(); toast(`${d.n} ${SLOT[si].toLowerCase()}: ${title(old)} → ${nm.d}.${g}`, true); render();
}
function doClear(w,di,si){
  snapshot();
  const d=W(w).days[di], old=d.m[si];
  const g=groceryNote(w,old,{needs:[]});
  d.m[si]=M("Open",SHARE[si],0,{ty:"open"}); record(w,di,si,title(old),"Open","Cleared on the page."+g);
  closeSheet(); toast(`${d.n} ${SLOT[si].toLowerCase()} is now Open (${SHARE[si]} set aside).${g}`, true); render();
}
function doMove(w,di,si,dj,sj){
  snapshot();
  const wk=W(w), a=wk.days[di].m[si], b=wk.days[dj].m[sj];
  wk.days[di].m[si]=b; wk.days[dj].m[sj]=a;
  record(w,dj,sj,title(b),title(a),`Moved from ${wk.days[di].n} ${SLOT[si].toLowerCase()}.`);
  record(w,di,si,title(a),title(b),`Moved from ${wk.days[dj].n} ${SLOT[sj].toLowerCase()}.`);
  closeSheet(); toast(`Moved ${title(a)} to ${wk.days[dj].n} ${SLOT[sj].toLowerCase()}; ${title(b)} took its place.`, true); render();
}
function saveEdit(w,di,si){
  const e=ui.sheet.edit, d=W(w).days[di], m=d.m[si];
  const newK=Math.round(e.reduce((a,x)=>a+x.g*x.kpg,0));
  if(newK===m.k){ closeSheet(); return; }
  snapshot();
  const was=m.k; m.k=newK; if(m.ty==="out") m.aim=newK;
  record(w,di,si,`${m.d} (${fmt(was)})`,`${m.d} (${fmt(newK)})`,"Amounts edited on the page.");
  closeSheet(); toast(`${m.d}: ${fmt(was)} → ${fmt(newK)} kcal. ${d.n} is now ${fmt(dayTotal(d))}.`, true); render();
}
function approve(){
  snapshot();
  const wk=W("next"); wk.approved=true; wk.approvedAt="Fri Oct 2, just now";
  const items=missingList("next");
  wk.days.forEach(d=>d.m.forEach(m=>{ if(m.needs) m.needs=m.needs.map(([i,s])=>[i,s==="need"?"list":s]); }));
  W("this").days[6].prep.draft=false;
  toast(`Next week approved. Grocery List: + ${items.join(", ")}.`, true); render();
}

// ---------- sheet (shared by all layouts) ----------
function openSheet(w,di,si){ ui.sheet={w,di,si,mode:"menu"}; renderSheet(); }
function closeSheet(){ ui.sheet=null; renderSheet(); }
function sheetMode(mode){
  ui.sheet.mode=mode;
  if(mode==="edit"){
    const m=W(ui.sheet.w).days[ui.sheet.di].m[ui.sheet.si];
    const parts = m.ty==="out" ? [["Calorie aim",1]] : m.d.includes("&") ? [[m.d.split(" & ")[0],.6],[m.d.split(" & ")[1],.4]] : m.d.includes("+") ? [[m.d.split(" + ")[0],.5],[m.d.split(" + ")[1],.5]] : [[m.d,1]];
    ui.sheet.edit = parts.map(([name,share])=>{ const k=m.k*share; const g = m.ty==="out" ? k : Math.round(k/1.6/5)*5; return {name, g, kpg: k/g, step: m.ty==="out"?50:10, unit: m.ty==="out"?"kcal":"g"}; });
  }
  renderSheet();
}
function editStep(i,dir){ const e=ui.sheet.edit[i]; e.g=Math.max(0,e.g+dir*e.step); renderSheet(); }
function renderSheet(){
  const el=document.getElementById("sheet");
  if(!ui.sheet){ el.innerHTML=""; return; }
  const {w,di,si,mode}=ui.sheet, wk=W(w), d=wk.days[di], m=d.m[si];
  const head = `<div class="row"><div class="sp"><div class="tag mute">${d.n} ${d.date} · ${SLOT[si]}${si<3?" · "+TIME[si]:""}${wk.approved?"":" · Draft"}</div><h2>${title(m)}</h2></div><button class="btn ghost" onclick="closeSheet()">✕</button></div>`;
  let body="";
  if(mode==="menu"){
    const lk=locked(w,di,si);
    body = `<div class="small" style="margin:6px 0 4px"><b>${fmt(kcal(m))}</b> kcal · share ${SHARE[si]}${m.t?` · ${m.t} min`:""}</div><div>${chips(w,di,si)}</div>
      ${m.ch && wk.approved ? `<div class="small mute" style="margin-top:8px">Changed by ${m.ch.by}, ${m.ch.when}: was <span class="strike">${m.ch.from}</span>. ${m.ch.why||""}</div>`:""}
      ${lk ? `<div class="card" style="margin:12px 0 0;background:#f4f3ef">Already ${m_eaten(m)?"logged ("+fmt(m.eaten)+" kcal)":"past"}. Change what you ate on Today.</div>`
      : `<div class="bigm" style="margin:12px 0 0;padding:0;box-shadow:none"><div class="acts" style="margin:0">
          <button onclick="sheetMode('swap')"><span>⇄</span>Swap</button><button onclick="sheetMode('edit')"><span>✎</span>Edit</button>
          <button onclick="sheetMode('move')"><span>↔</span>Move</button><button onclick="doClear('${w}',${di},${si})"><span>✕</span>Clear</button></div></div>`}
      <button class="btn ghost" style="margin-top:10px" onclick="toast('Opens Chat with this meal attached')">Ask the Agent about this meal ›</button>`;
  }
  if(mode==="swap"){
    let alts = POOL[si].map((x,i)=>({x,i})).filter(({x})=>x.d!==m.d);
    if(wk.approved) alts.sort((a,b)=>(a.x.needs?1:0)-(b.x.needs?1:0));   // Pantry first after approval
    alts = alts.slice(0,3);
    body = `<div class="small mute" style="margin:6px 0">3 alternatives for ${SLOT[si].toLowerCase()} (share ${SHARE[si]})${wk.approved?", Pantry first":""}. Today stays ${fmt(dayTotal(d))} → shown per option.</div>
      ${alts.map(({x,i})=>{ const nt=dayTotal(d)-kcal(m)+x.k; return `<div class="opt" onclick="doSwap('${w}',${di},${si},${i})"><div class="row"><b class="sp">${x.d}</b><span>${fmt(x.k)}</span></div>
        <div class="small mute">${WHY[x.d]||""} · ${x.t} min · day → <span class="${nt>TARGET?'warn':''}">${fmt(nt)}</span></div>${x.needs&&wk.approved?`<div class="xs warn">Adds ${x.needs.map(n=>n[0]).join(", ")} to the Grocery List</div>`:""}</div>`; }).join("")}
      <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="toast('The Agent would offer 3 more')">Show 3 more</button><span class="sp"></span><button class="btn ghost" onclick="sheetMode('menu')">‹ Back</button></div>`;
  }
  if(mode==="edit"){
    const e=ui.sheet.edit, nk=Math.round(e.reduce((a,x)=>a+x.g*x.kpg,0)), nt=dayTotal(d)-kcal(m)+nk;
    body = `<div class="small mute" style="margin:6px 0">${m.ty==="out"?"Change the calorie aim for this Eating Out meal.":"Change the amounts. Calories update as you go."}</div>
      ${e.map((x,i)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="sp">${x.name}</span><span class="step"><button onclick="editStep(${i},-1)">−</button><span>${fmt(x.g)} ${x.unit}</span><button onclick="editStep(${i},1)">+</button></span></div>`).join("")}
      ${m.ty!=="out"?`<button class="btn ghost" onclick="toast('Adds an ingredient line (search the Food Library)')">+ Add ingredient</button>`:""}
      <div class="row" style="margin-top:8px"><span class="sp">Meal <b>${fmt(nk)}</b> · share ${SHARE[si]}</span><span>Day <b class="${nt>TARGET?'warn':''}">${fmt(nt)}</b> / ${fmt(TARGET)}</span></div>
      ${nt>TARGET?`<div class="small warn">This puts ${d.n} over the Calorie Target.</div>`:""}
      <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="sheetMode('menu')">‹ Back</button><span class="sp"></span><button class="btn" onclick="saveEdit('${w}',${di},${si})">Save</button></div>`;
  }
  if(mode==="move"){
    body = `<div class="small mute" style="margin:6px 0">Tap a slot. The two meals trade places.</div>
      <div class="mv"><span></span>${SL.map(s=>`<b class="xs mute" style="text-align:center">${s}</b>`).join("")}
      ${wk.days.map((dd,j)=>`<b class="xs" style="align-self:center">${dd.n}</b>${dd.m.map((mm,k)=>`<button ${ (j===di&&k===si)?'class="me" disabled':''} ${locked(w,j,k)?"disabled":""} onclick="doMove('${w}',${di},${si},${j},${k})">${title(mm).slice(0,16)}</button>`).join("")}`).join("")}</div>
      <div class="xs mute" style="margin-top:6px">Moving across slots changes the calorie share, so the portion is resized (not shown in this prototype).</div>
      <button class="btn ghost" style="margin-top:8px" onclick="sheetMode('menu')">‹ Back</button>`;
  }
  el.innerHTML = `<div class="shade" onclick="closeSheet()"></div><div class="sheet">${head}${body}</div>`;
}

// ---------- shared bits for the week header ----------
function draftBanner(){
  const wk=W("next");
  if(wk.approved) return `<div class="card small" style="background:#f3faf5;border:1px solid #bfe0cb">✓ Approved ${wk.approvedAt}. The Grocery List has its Missing Ingredients. Changes from now on are marked.</div>`;
  return `<div class="card draftband"><div class="row"><span class="tag" style="color:#8a6d00">Draft · waiting for your yes</span><span class="sp"></span><span class="xs mute">${wk.draftAt}</span></div>
    <div class="small" style="margin-top:6px">Built with what you accepted in the reflection:</div>
    <ul class="small" style="margin:4px 0 0;padding-left:18px">${wk.intro.map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="small mute" style="margin-top:6px">Plus: Busy Wednesday (15-min meals), 2 new Dishes, leftovers first. The Prep Session goes on this Sunday.</div></div>`;
}
function changesList(w, compact){
  const wk=W(w);
  if(!wk.approved) return "";
  if(!wk.changes.length) return `<div class="small mute">No changes since approval.</div>`;
  return wk.changes.map(c=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line);align-items:flex-start"><span class="dot" style="margin-top:6px"></span>
    <div class="sp"><div class="small"><b>${wk.days[c.di].n} ${SLOT[c.si].toLowerCase()}</b>: <span class="strike">${c.from}</span> → ${c.to}</div>
    <div class="xs mute">${c.by} · ${c.when}${compact?"":" · "+c.why}</div></div></div>`).join("");
}
function missingCard(w){
  const n=missingCount(w), list=missingList(w), wk=W(w);
  if(!n) return `<span class="chip bought">Missing Ingredients: none</span>`;
  return `<span class="chip need" title="${list.join(', ')}">🛒 ${n} Missing Ingredient${n>1?"s":""}${wk.approved?" · on Grocery List":""}</span>`;
}

  }
  const t=dayTotal(d);
  const day = `<div class="row" style="margin:6px 16px 0"><button class="btn line sm" onclick="stepDay(-1)">‹</button><div class="sp" style="text-align:center"><b>${d.n==="Fri"&&w==="this"?"Today · ":""}${{Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday",Sun:"Sunday"}[d.n]} ${d.date}</b>
      <div class="xs mute">${w==="this"?"This week":"Next week"}${wk.approved?"":" · Draft"}${d.busy?" · Busy Day, 15-min meals":""}</div></div><button class="btn line sm" onclick="stepDay(1)">›</button></div>
    <div class="card" style="padding:10px 14px"><div class="row"><span class="small sp">Planned</span><span class="small">${totalLine(d)}</span></div><div style="margin-top:6px">${totalBar(d)}</div>
      ${t>TARGET?`<div class="xs warn" style="margin-top:4px">Over the Calorie Target by ${fmt(t-TARGET)}</div>`:`<div class="xs mute" style="margin-top:4px">${fmt(TARGET-t)} under</div>`}</div>
    ${d.prep?`<div class="card small" style="background:#faf5e8">🍳 ${d.prep.text}${d.prep.draft?` <span class="tag" style="color:#8a6d00">· from next week's draft</span>`:""}</div>`:""}
    ${d.m.map((m,si)=>{ const lk=locked(w,i,si), chg=m.ch&&wk.approved;
      return `<div class="bigm ty-${m.ty}" style="${chg?'box-shadow:0 0 0 2px var(--chg) inset':''}"><div class="row"><span class="tag mute sp">${SLOT[si]}${si<3?" · "+TIME[si]:""}</span><span>${fmt(kcal(m))}<span class="xs mute"> / ${SHARE[si]}</span></span></div>
        ${chg?`<div class="xs" style="color:#9a5a00;margin-top:4px">Changed by ${m.ch.by}, ${m.ch.when} · was <span class="strike">${m.ch.from}</span></div>`:""}
        <div class="nm">${title(m)}</div>${m_eaten(m)?`<div class="xs good">✓ logged ${fmt(m.eaten)}</div>`:""}<div>${chips(w,i,si)}</div>
        ${lk?"":`<div class="acts"><button onclick="openSheet('${w}',${i},${si});sheetMode('swap')"><span>⇄</span>Swap</button><button onclick="openSheet('${w}',${i},${si});sheetMode('edit')"><span>✎</span>Edit</button><button onclick="openSheet('${w}',${i},${si});sheetMode('move')"><span>↔</span>Move</button><button onclick="doClear('${w}',${i},${si})"><span>✕</span>Clear</button></div>`}</div>`; }).join("")}
    ${w==="next"&&!wk.approved?`<div class="sticky row draftband" style="padding:8px 10px"><span class="small sp"><b>Draft</b> · ${missingCount("next")} Missing Ingredients</span><button class="btn line sm" onclick="ui.review=true;render()">Summary</button>&nbsp;<button class="btn good sm" onclick="approve()">Approve</button></div>`:""}`;
  return head + strip + day;
}
function stepDay(dir){
  let {w,i}=ui.day; i+=dir;
  if(i>6){ if(w==="this"){w="next";i=0;} else i=6; }
  if(i<0){ if(w==="next"){w="this";i=6;} else i=0; }
  ui.day={w,i}; render();
}

// ---------- shell + switcher ----------
function toast(msg, withUndo){
  const box=document.getElementById("toastbox");
  box.innerHTML = `<div class="toast"><span>${msg}</span>${withUndo?`<button onclick="undo()">Undo</button>`:""}</div>`;
  clearTimeout(toast.t); toast.t=setTimeout(()=>box.innerHTML="", withUndo?6000:2500);
}
const VARIANTS = {A:["Week grid",VariantA], B:["List of days",VariantB], C:["One day at a time",VariantC]};
const KEYS = Object.keys(VARIANTS);
function cycle(dir){ variant = KEYS[(KEYS.indexOf(variant)+dir+KEYS.length)%KEYS.length]; ui.showChanges=false; history.replaceState(null,"","?variant="+variant); closeSheet(); render(); scrollTo(0,0); }
function render(){
  if(!VARIANTS[variant]) variant="A";
  document.getElementById("app").innerHTML = VARIANTS[variant][1]() + `
    <div class="tabs">${[["Today","◉"],["Plan","▦"],["Pantry","▣"],["Grocery","☐"],["Chat","✉"]].map(([n,i])=>`<button class="${n==='Plan'?'cur':''}" onclick="${n==='Plan'?'':`toast('Not in this prototype')`}"><span class="i">${i}</span>${n}</button>`).join("")}</div>`;
  document.getElementById("sw").innerHTML = `<button onclick="cycle(-1)">←</button><b>${variant} · ${VARIANTS[variant][0]}</b><button onclick="cycle(1)">→</button>
    <button onclick="S=fresh();undoStack=[];ui.review=true;ui.day={w:'this',i:4};render()" title="Reset state">↺</button>`;
  if(variant==="C"){ const s=document.getElementById("strip"), b=s&&s.querySelector("button.on"); if(b) s.scrollLeft=b.offsetLeft-s.offsetWidth/2+25; }
}
addEventListener("keydown", e => { if(e.target.closest("input,textarea,[contenteditable]")) return; if(e.key==="ArrowLeft") cycle(-1); if(e.key==="ArrowRight") cycle(1); if(e.key==="Escape") closeSheet(); });
render();
</script>
